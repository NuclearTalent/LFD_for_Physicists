<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>MCMC Interactive Gallery</title>
    <script src="lib/dat.gui.min.js"></script>
    <script src="lib/conrec.min.js"></script>
    <script src="lib/canvas-5-polyfill.js"></script>
    <script src="lib/linalg.core.js"></script>
    <script src="lib/linalg.opt.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/2.4.3/seedrandom.min.js"></script>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
      }
      body {
        font-family: Arial, sans-serif;
      }
      #github {
        display: inline-block;
        position: fixed;
        bottom: 5px;
        left: 5px;
      }
      #info {
        display: inline-block;
        position: fixed;
        top: 5px;
        left: 5px;
      }
      .dg,
      .dg li.save-row .button {
        text-shadow: none !important;
      }
      .dg.main.taller-than-window .close-button {
        border-top: 1px solid #ddd;
      }
      .dg.main .close-button {
        background-color: #eee;
      }
      .dg.main .close-button:hover {
        background-color: #ddd;
      }
      .dg {
        color: #555;
      }
      .dg.main::-webkit-scrollbar {
        background: #fafafa;
      }
      .dg.main::-webkit-scrollbar-thumb {
        background: #bbb;
      }
      .dg li:not(.folder) {
        background: rgba(240, 240, 240, 0.6);
        border-bottom: 1px solid rgba(200, 200, 200, 0.5);
      }
      .dg li.title {
        background: url(data:image/gif;base64,R0lGODlhBQAFAJEAAP////Pz8////////yH5BAEAAAIALAAAAAAFAAUAAAIIlI+hKgFxoCgAOw==)
          6px 10px no-repeat rgba(230, 230, 230, 0.7);
      }
      .dg .cr.boolean:hover,
      .dg .cr.function:hover {
        background: #fff;
      }
      .dg .c input[type="text"] {
        background: #e9e9e9;
      }
      .dg .c input[type="text"]:hover {
        background: #eee;
      }
      .dg .c input[type="text"]:focus {
        background: #eee;
        color: #555;
      }
      .dg .c .slider {
        background: #e9e9e9;
      }
      .dg .c .slider:hover {
        background: #eee;
      }

      #quickControls {
        position: fixed;
        top: 0px;
        right: 325px;   /* leaves room for the dat.GUI panel */
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        background: rgba(250, 250, 250, 0.85);
        border: 1px solid rgba(120, 120, 120, 0.45);
        border-radius: 6px;
        font: 13px Arial, sans-serif;
        color: #333;
      }

      #quickControls label { 
        display: flex; 
        align-items: center; 
        gap: 4px; margin: 0; 
        white-space: nowrap; }
      
      #quickControls button {
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      
      #quickStep {
        border: 1px solid #2f6fab;
        background: #eef6ff;
      }

      #quickStep:hover { 
        background: #dcefff; 
      }      

      #quickReset {
        border: 1px solid #a64b4b;
        background: #fff0f0;
      }

      #quickReset:hover { 
        background: #ffe3e3; 
      }

      /* Move dat.GUI down slightly so it does not overlap */ .
      .dg.ac { 
        top: 38px !important; 
      }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <canvas id="plotCanvas" width="100%" height="100%"></canvas>
    <script src="main/MultivariateNormal.js"></script>
    <script src="main/MCMC.js"></script>

    <script>
      window.DEFAULT_ALGORITHM = "NSRadFriends";
    </script>

    <script src="algorithms/RandomWalkMH.js"></script>
    <script src="algorithms/AdaptiveMH.js"></script>
    <script src="algorithms/HamiltonianMC.js"></script>
    <script src="algorithms/NaiveNUTS.js"></script>
    <script src="algorithms/MALA.js"></script>
    <script src="algorithms/H2MC.js"></script>
    <script src="algorithms/GibbsSampling.js"></script>
    <script src="algorithms/SVGD.js"></script>
    <script src="algorithms/NSRadFriends.js"></script>
    <script src="algorithms/DE-MCMC-Z.js"></script>

    <script src="main/Visualizer.js"></script>
    <script src="main/Simulation.js"></script>

    <div id="quickControls"> 
      <label> 
        <input id="quickAutoplay" type="checkbox" checked> Autoplay 
      </label> 
      <button id="quickStep" type="button"> Step </button> 
      <button id="quickReset" type="button"> Reset </button> 
    </div>  
  </body>
</html>
