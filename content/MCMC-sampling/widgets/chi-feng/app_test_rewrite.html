<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Random Walk Metropolis-Hastings</title>

  <script src="lib/d3.min.js"></script>
  <script src="lib/dat.gui.min.js"></script>
  <script src="lib/conrec.js"></script>
  <script src="lib/seedrandom.min.js"></script>

  <script src="main/Matrix.js"></script>
  <script src="main/MCMC.js"></script>
  <script src="main/Visualizer.js"></script>
  <script src="main/Simulation.js"></script>

  <script src="algorithms/RandomWalkMH.js"></script>

  <script src="targets/banana.html.js"></script>
  <script src="targets/circle.html.js"></script>
  <script src="targets/funnel.html.js"></script>
  <script src="targets/multimodal.html.js"></script>
  <script src="targets/ring.html.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #plotCanvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    #xHistCanvas {
      position: absolute;
      top: 0;
      right: 0;
    }

    #yHistCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    #info {
      position: absolute;
      left: 10px;
      bottom: 10px;
      max-width: 420px;
      background: rgba(255,255,255,0.85);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.35;
      z-index: 1000;
    }

    /* ---------- NEW QUICK CONTROLS ---------- */

    #quickControls {
      position: fixed;
      top: 6px;
      right: 315px;   /* leaves room for dat.GUI */
      z-index: 10000;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 5px 8px;

      background: rgba(250,250,250,0.88);
      border: 1px solid rgba(120,120,120,0.45);
      border-radius: 6px;

      font: 13px Arial, sans-serif;
      color: #333;
    }

    #quickControls label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      white-space: nowrap;
    }

    #quickControls button {
      padding: 2px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    #quickStep {
      border: 1px solid #2f6fab;
      background: #eef6ff;
    }

    #quickStep:hover {
      background: #dcefff;
    }

    #quickReset {
      border: 1px solid #a64b4b;
      background: #fff0f0;
    }

    #quickReset:hover {
      background: #ffe3e3;
    }

    /* Move dat.GUI down slightly */
    .dg.ac {
      top: 38px !important;
    }
  </style>
</head>

<body>

  <canvas id="plotCanvas"></canvas>
  <canvas id="xHistCanvas"></canvas>
  <canvas id="yHistCanvas"></canvas>

  <div id="info"></div>

  <!-- ---------- NEW ALWAYS-VISIBLE CONTROLS ---------- -->

  <div id="quickControls">
    <label>
      <input id="quickAutoplay" type="checkbox" checked>
      Autoplay
    </label>

    <button id="quickStep" type="button">
      Step
    </button>

    <button id="quickReset" type="button">
      Reset
    </button>
  </div>

</body>
</html>
