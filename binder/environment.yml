  - pytorch
  - defaults
dependencies:
  - python=3.11.*
  - nb_conda_kernels=2.5.*
  - numpy=1.26.*
  - scipy=1.16.*
  - matplotlib=3.10.*
  - pandas=2.3.*
  - seaborn=0.13.*
